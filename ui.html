<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Studio</title>
    <style>
        :root {
            --bg: #25272a;
            --sidebar: #202225;
            --toolbar: #2b2d31;
            --panel: #2d3034;
            --panel-2: #34373c;
            --panel-3: #3a3e43;
            --canvas: #1b1d20;
            --text: #f1f2f4;
            --text-2: #c8ccd1;
            --muted: #858b94;
            --faint: #60666e;
            --line: #3b3e43;
            --line-2: #4a4e54;
            --accent: #7d9cff;
            --accent-rgb: 125, 156, 255;
            --danger: #eb7079;
            --success: #63c69d;
            --warning: #d8ad5c;
            --sidebar-width: 228px;
            --thumb-size: 220px;
            color-scheme: dark;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body { width: 100%; min-height: 100%; overflow-x: hidden; }
        body {
            min-height: 100vh;
            overflow-x: hidden;
            background: var(--bg);
            color: var(--text);
            font: 13px/1.4 "Segoe UI Variable", "Segoe UI", Inter, system-ui, sans-serif;
            font-feature-settings: "cv01", "ss03";
        }
        button, input, select { font: inherit; }
        button, select { cursor: pointer; }
        button:focus-visible, input:focus-visible, select:focus-visible, summary:focus-visible {
            outline: 2px solid var(--accent);
            outline-offset: 2px;
        }
        * { scrollbar-width: thin; scrollbar-color: #555a61 transparent; }
        ::selection { background: rgba(var(--accent-rgb), .35); }

        /* Studio is an Explore surface: fixed navigation, compact tools, image-first workspace. */
        .studio-shell {
            min-height: 100vh;
            display: grid;
            grid-template-columns: var(--sidebar-width) minmax(0, 1fr);
        }
        .studio-shell.sidebar-collapsed { --sidebar-width: 64px; }

        .studio-sidebar {
            position: fixed;
            top: 0;
            left: 0;
            width: var(--sidebar-width);
            height: 100vh;
            z-index: 120;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            border-right: 1px solid var(--line);
            background: var(--sidebar);
        }
        .sidebar-brand {
            height: 52px;
            flex: 0 0 52px;
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 0 12px;
            border-bottom: 1px solid var(--line);
        }
        .studio-mark {
            width: 28px;
            height: 28px;
            flex: 0 0 28px;
            display: grid;
            place-items: center;
            border: 1px solid var(--line-2);
            border-radius: 7px;
            background: var(--panel-2);
            color: var(--accent);
            font-size: 12px;
            font-weight: 700;
        }
        .studio-wordmark { min-width: 0; flex: 1; }
        .studio-wordmark strong { display: block; font-size: 14px; font-weight: 620; letter-spacing: -.2px; }
        .studio-wordmark span { display: block; margin-top: 1px; color: var(--muted); font-size: 9px; letter-spacing: .08em; text-transform: uppercase; }
        .sidebar-collapse {
            width: 26px;
            height: 26px;
            min-height: 0;
            padding: 0;
            border: 0;
            border-radius: 5px;
            background: transparent;
            color: var(--muted);
        }
        .sidebar-collapse:hover { background: var(--panel-2); color: var(--text); }
        .sidebar-scroll { min-width: 0; flex: 1; overflow-x: hidden; overflow-y: auto; padding: 10px 8px 16px; }
        .sidebar-section { margin-bottom: 16px; }
        .sidebar-label {
            padding: 0 8px 6px;
            color: var(--faint);
            font-size: 9px;
            font-weight: 650;
            letter-spacing: .12em;
            text-transform: uppercase;
        }
        .sidebar-action, .sidebar-nav-item, #folderBtn {
            width: 100%;
            min-height: 32px;
            display: flex;
            align-items: center;
            justify-content: flex-start;
            gap: 9px;
            padding: 0 9px;
            border: 1px solid transparent;
            border-radius: 6px;
            background: transparent;
            color: var(--text-2);
            font-size: 11.5px;
            text-align: left;
        }
        .sidebar-action:hover, .sidebar-nav-item:hover, #folderBtn:hover { background: var(--panel); color: var(--text); }
        .sidebar-action.active, .sidebar-nav-item.active, #folderBtn.active {
            border-color: rgba(var(--accent-rgb), .22);
            background: rgba(var(--accent-rgb), .12);
            color: #cbd6ff;
        }
        .ui-icon {
            width: 16px;
            height: 16px;
            flex: 0 0 16px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            color: currentColor;
            font-size: 11px;
        }
        .folder-manager { position: static; }
        .folder-dropdown {
            position: static;
            display: none;
            width: 100%;
            min-width: 0;
            margin: 5px 0 0;
            padding: 0;
            border: 0;
            background: transparent;
            box-shadow: none;
        }
        .folder-dropdown.active { display: block; }
        .folder-list { max-height: none; margin: 0; overflow: visible; }
        .folder-item {
            min-height: 31px;
            display: flex;
            align-items: center;
            gap: 5px;
            margin: 1px 0;
            padding: 0 4px 0 9px;
            border: 1px solid transparent;
            border-radius: 6px;
            color: var(--text-2);
        }
        .folder-item::before { content: "▱"; width: 16px; color: var(--muted); font-size: 10px; }
        .folder-item:hover { background: var(--panel); color: var(--text); }
        .folder-item.active { border-color: rgba(var(--accent-rgb), .20); background: rgba(var(--accent-rgb), .12); color: #d4dcff; }
        .folder-item-content { min-width: 0; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 11.5px; cursor: pointer; }
        .folder-add-disclosure { margin-top: 8px; border-top: 1px solid var(--line); padding-top: 8px; }
        .folder-add-disclosure summary { padding: 6px 8px; border-radius: 5px; color: var(--muted); font-size: 10.5px; cursor: pointer; list-style: none; }
        .folder-add-disclosure summary:hover { background: var(--panel); color: var(--text-2); }
        .folder-add-disclosure summary::-webkit-details-marker { display: none; }
        .folder-add-form { padding: 7px 5px 2px; }
        .folder-add-form input {
            width: 100%; height: 31px; margin-bottom: 6px; padding: 0 8px;
            border: 1px solid var(--line); border-radius: 6px; outline: 0;
            background: var(--canvas); color: var(--text);
        }
        #addFolderBtn { width: 100%; height: 31px; border: 1px solid var(--line-2); border-radius: 6px; background: var(--panel-2); color: var(--text-2); }

        .studio-shell.sidebar-collapsed .studio-wordmark,
        .studio-shell.sidebar-collapsed .sidebar-label,
        .studio-shell.sidebar-collapsed .sidebar-action span:not(.ui-icon),
        .studio-shell.sidebar-collapsed #folderBtn span:not(.ui-icon),
        .studio-shell.sidebar-collapsed .folder-item-content,
        .studio-shell.sidebar-collapsed .folder-add-form { display: none !important; }
        .studio-shell.sidebar-collapsed .sidebar-brand { gap: 3px; padding: 0 4px; }
        .studio-shell.sidebar-collapsed .studio-mark { width: 28px; flex-basis: 28px; }
        .studio-shell.sidebar-collapsed .sidebar-collapse { width: 24px; flex: 0 0 24px; }
        .studio-shell.sidebar-collapsed .sidebar-scroll { padding-inline: 9px; }
        .studio-shell.sidebar-collapsed .sidebar-action,
        .studio-shell.sidebar-collapsed #folderBtn { justify-content: center; padding: 0; }
        .studio-shell.sidebar-collapsed .folder-dropdown.active { display: block; margin-top: 4px; }
        .studio-shell.sidebar-collapsed .folder-item { justify-content: center; min-height: 34px; padding: 0; }
        .studio-shell.sidebar-collapsed .folder-item::before { width: 16px; text-align: center; }
        .studio-shell.sidebar-collapsed .folder-add-disclosure { padding-top: 6px; }
        .studio-shell.sidebar-collapsed .folder-add-disclosure summary {
            min-height: 34px; display: grid; place-items: center; padding: 0; font-size: 0;
        }
        .studio-shell.sidebar-collapsed .folder-add-disclosure summary::before { content: "＋"; font-size: 16px; }

        .library-main { grid-column: 2; min-width: 0; min-height: 100vh; padding-top: 52px; background: var(--bg); }
        .library-toolbar {
            position: fixed;
            top: 0;
            right: 0;
            left: var(--sidebar-width);
            z-index: 100;
            min-height: 52px;
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 7px 12px;
            border-bottom: 1px solid var(--line);
            background: rgba(43,45,49,.97);
        }
        .location-block { min-width: 0; flex: 0 0 180px; max-width: 180px; margin-right: auto; }
        .location-block strong { display: block; overflow: hidden; color: var(--text); font-size: 12px; font-weight: 600; text-overflow: ellipsis; white-space: nowrap; }
        .location-block span { display: block; margin-top: 1px; overflow: hidden; color: var(--muted); font-size: 9.5px; text-overflow: ellipsis; white-space: nowrap; }
        .toolbar-controls { min-width: 0; display: flex; align-items: center; justify-content: flex-end; gap: 5px; flex-wrap: nowrap; }
        .search-container {
            width: 210px;
            min-width: 150px;
            height: 34px;
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 0 9px;
            border: 1px solid var(--line);
            border-radius: 7px;
            background: var(--canvas);
        }
        .search-container:focus-within { border-color: rgba(var(--accent-rgb), .65); box-shadow: 0 0 0 2px rgba(var(--accent-rgb), .10); }
        .search-container input { width: 100%; min-width: 0; border: 0; outline: 0; background: transparent; color: var(--text); font-size: 11.5px; }
        .search-container input::placeholder { color: var(--faint); }
        .toolbar-button, .toolbar-controls button, .toolbar-controls select {
            height: 34px;
            min-height: 34px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
            padding: 0 9px;
            border: 1px solid var(--line);
            border-radius: 7px;
            background: var(--panel);
            color: var(--text-2);
            font-size: 10.5px;
        }
        .toolbar-controls button:hover, .toolbar-controls select:hover { border-color: var(--line-2); background: var(--panel-2); color: var(--text); }
        .toolbar-controls button.active { border-color: rgba(var(--accent-rgb), .50); background: rgba(var(--accent-rgb), .13); color: #c5d2ff; }
        .toolbar-controls select option { background: var(--panel); color: var(--text); }
        #compareBtn { display: none; border-color: rgba(99,198,157,.45); background: rgba(99,198,157,.13); color: #a9e5cb; }
        .thumb-control { height: 34px; display: flex; align-items: center; gap: 6px; padding: 0 8px; border: 1px solid var(--line); border-radius: 7px; background: var(--panel); color: var(--muted); }
        .thumb-control input { width: 58px; accent-color: var(--accent); }

        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(var(--thumb-size), 1fr));
            gap: 8px;
            padding: 10px;
            transform: translateZ(0);
        }
        .image-card {
            position: relative;
            min-width: 0;
            overflow: hidden;
            border: 1px solid var(--line);
            border-radius: 7px;
            background: var(--panel);
            cursor: pointer;
            transform: translateZ(0);
            transition: border-color .12s, background .12s, transform .12s;
        }
        .image-card:hover { border-color: var(--line-2); background: var(--panel-2); transform: translateY(-1px); }
        .image-card img, .image-card video, .audio-thumbnail {
            width: 100%;
            height: var(--thumb-size);
            display: block;
            object-fit: cover;
            background: var(--canvas);
        }
        .audio-thumbnail { display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .audio-thumbnail .audio-icon { color: var(--muted); font-size: 36px; }
        .audio-thumbnail audio { display: none; }
        .image-info { min-height: 42px; padding: 7px 9px; border-top: 1px solid var(--line); background: var(--panel); }
        .image-name { overflow: hidden; color: var(--text-2); font-size: 10.5px; font-weight: 510; text-overflow: ellipsis; white-space: nowrap; }
        .favorite-btn {
            position: absolute; top: 7px; left: 7px; z-index: 10;
            width: 25px; height: 25px; min-height: 0; padding: 0;
            border: 1px solid rgba(255,255,255,.18); border-radius: 6px;
            background: rgba(29,31,34,.78); color: #eef0f3; opacity: .25;
        }
        .image-card:hover .favorite-btn, .favorite-btn.favorited { opacity: 1; }
        .favorite-btn.favorited { border-color: #d8ad5c; background: #d8ad5c; color: #201a0e; }
        .video-indicator, .audio-indicator {
            position: absolute; top: 7px; right: 7px; z-index: 5;
            padding: 4px 6px; border: 1px solid rgba(255,255,255,.14); border-radius: 5px;
            background: rgba(29,31,34,.80); color: #eff1f4; font-size: 8px; letter-spacing: .08em; text-transform: uppercase;
        }
        .video-indicator::before { content: "▶ "; }
        .audio-indicator::before { content: "♪ "; }
        .image-card.selected { border: 2px solid var(--accent); background: rgba(var(--accent-rgb), .08); box-shadow: 0 0 0 2px rgba(var(--accent-rgb), .17); }
        .image-card.selected::after {
            content: "✓";
            position: absolute; top: 7px; right: 7px; z-index: 12;
            width: 23px; height: 23px; display: grid; place-items: center;
            border: 2px solid var(--panel); border-radius: 50%; background: var(--accent); color: #17191d; font-size: 12px; font-weight: 800;
        }
        .image-card.selected .video-indicator, .image-card.selected .audio-indicator { right: 37px; }
        .image-card.compare-first { border: 2px solid var(--success); box-shadow: 0 0 0 2px rgba(99,198,157,.15); }
        .image-card.compare-second { border: 2px solid var(--danger); box-shadow: 0 0 0 2px rgba(235,112,121,.15); }
        .loading { padding: 22px; color: var(--muted); text-align: center; }

        .multi-select-actions {
            position: fixed; left: calc(var(--sidebar-width) + (100vw - var(--sidebar-width)) / 2); bottom: 18px; z-index: 300;
            transform: translateX(-50%);
            display: none; align-items: center; gap: 4px;
            padding: 6px; border: 1px solid var(--line-2); border-radius: 9px;
            background: #303338; box-shadow: 0 12px 28px rgba(0,0,0,.30);
        }
        .multi-select-actions .selected-info { padding: 0 8px; color: var(--text-2); font-size: 11px; font-weight: 600; }
        .multi-select-actions button { height: 30px; min-height: 30px; padding: 0 8px; border: 1px solid var(--line); border-radius: 6px; background: var(--panel); color: var(--text-2); font-size: 10px; }
        #deleteSelectedBtn { color: #ffabb1; }

        .context-menu, .notification {
            position: absolute; z-index: 10000; min-width: 190px; display: none;
            padding: 5px; border: 1px solid var(--line-2); border-radius: 8px;
            background: #303338; color: var(--text-2); box-shadow: 0 12px 30px rgba(0,0,0,.32);
        }
        .context-menu-item { display: flex; align-items: center; gap: 7px; padding: 7px 8px; border-radius: 5px; font-size: 11px; cursor: pointer; }
        .context-menu-item:hover { background: rgba(var(--accent-rgb), .12); color: #d0d9ff; }
        .context-menu-divider { height: 1px; margin: 4px; background: var(--line); }
        .context-menu-item-danger:hover { background: rgba(235,112,121,.10); color: #ffabb1; }
        .notification { position: fixed; top: 14px; right: 14px; display: block; padding: 9px 12px; transform: translateX(340px); transition: transform .18s; }
        .notification.show { transform: translateX(0); }
        .notification-success { border-color: rgba(99,198,157,.5); }
        .notification-error { border-color: rgba(235,112,121,.6); }

        .modal {
            position: fixed; inset: 0; z-index: 1000; display: none;
            grid-template-rows: 46px minmax(0, 1fr);
            background: var(--canvas);
        }
        .modal.active { display: grid; }
        .viewer-toolbar {
            min-width: 0;
            display: flex; align-items: center; gap: 8px;
            padding: 6px 10px; border-bottom: 1px solid var(--line); background: var(--toolbar);
        }
        .viewer-back, .viewer-toolbar button {
            height: 32px; min-height: 32px; padding: 0 9px;
            border: 1px solid var(--line); border-radius: 6px; background: var(--panel); color: var(--text-2); font-size: 10.5px;
        }
        .viewer-back:hover, .viewer-toolbar button:hover { background: var(--panel-2); color: var(--text); }
        .viewer-identity { min-width: 0; flex: 1; }
        .viewer-identity strong { display: block; overflow: hidden; font-size: 11.5px; font-weight: 590; text-overflow: ellipsis; white-space: nowrap; }
        .viewer-identity span { display: block; margin-top: 1px; color: var(--muted); font-size: 9px; }
        .modal-close {
            position: static; width: 32px; height: 32px; display: grid; place-items: center;
            border: 1px solid var(--line); border-radius: 6px; background: var(--panel); color: var(--muted); font-size: 18px; cursor: pointer;
        }
        .modal-close:hover { background: var(--panel-2); color: var(--text); }
        .modal-content { min-width: 0; min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr) 370px; }
        .viewer-stage { min-width: 0; min-height: 0; display: grid; grid-template-rows: minmax(0, 1fr) 86px; background: var(--canvas); }
        .modal-left { min-width: 0; min-height: 0; position: relative; display: flex; align-items: center; justify-content: center; overflow: hidden; padding: 14px; }
        .modal-left img, .modal-left video { max-width: 100%; max-height: 100%; display: block; object-fit: contain; }
        .modal-zoom-stage { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; overflow: hidden; }
        .modal-zoom-stage img { transform-origin: center; transition: transform .10s; user-select: none; -webkit-user-drag: none; }
        .modal-zoom-controls {
            position: absolute; top: 10px; left: 10px; z-index: 20;
            display: flex; align-items: center; gap: 3px; padding: 3px;
            border: 1px solid var(--line-2); border-radius: 7px; background: rgba(45,48,52,.92);
        }
        .modal-zoom-btn, .compare-zoom-btn { width: 28px; height: 28px; min-height: 28px; padding: 0; border: 1px solid var(--line); border-radius: 5px; background: var(--panel); color: var(--text-2); }
        .modal-zoom-btn-reset, .compare-zoom-reset { width: 58px; }
        .modal-nav {
            position: absolute; top: 50%; z-index: 1010; transform: translateY(-50%);
            width: 34px; height: 44px; min-height: 44px; padding: 0;
            border: 1px solid var(--line); border-radius: 6px; background: rgba(45,48,52,.90); color: var(--muted);
        }
        .modal-nav:hover { border-color: var(--line-2); color: var(--text); }
        .modal-nav-prev { left: 10px; }
        .modal-nav-next { right: 380px; }
        .modal-filmstrip {
            min-width: 0; display: flex; align-items: center; gap: 6px;
            padding: 7px 10px; border-top: 1px solid var(--line); background: #222428;
        }
        .filmstrip-track { min-width: 0; flex: 1; display: flex; gap: 5px; overflow-x: auto; padding: 1px; }
        .filmstrip-thumb { width: 66px; height: 66px; flex: 0 0 66px; padding: 0; overflow: hidden; border: 1px solid var(--line); border-radius: 5px; background: var(--panel); }
        .filmstrip-thumb img, .filmstrip-thumb video { width: 100%; height: 100%; object-fit: cover; }
        .filmstrip-thumb.active { border: 2px solid var(--accent); box-shadow: 0 0 0 2px rgba(var(--accent-rgb),.14); }
        .filmstrip-count { flex: 0 0 auto; padding: 0 4px; color: var(--muted); font-size: 10px; font-variant-numeric: tabular-nums; }
        .modal-right { min-width: 0; min-height: 0; height: 100%; display: flex; flex-direction: column; overflow-y: auto; border-left: 1px solid var(--line); background: var(--panel); }
        .modal-header-actions { padding: 10px; border-bottom: 1px solid var(--line); }
        .modal-action-btn { width: 100%; height: 32px; border: 1px solid var(--line); border-radius: 6px; background: var(--panel-2); color: var(--text-2); font-size: 10.5px; }
        .modal-action-btn.favorite { color: #efd18e; }
        .modal-view-toggle { display: grid; grid-template-columns: 1fr 1fr; gap: 3px; margin-top: 7px; padding: 3px; border: 1px solid var(--line); border-radius: 7px; background: var(--canvas); }
        .modal-view-btn { height: 29px; border: 0; border-radius: 5px; background: transparent; color: var(--muted); font-size: 10px; }
        .modal-view-btn.active { background: var(--panel-3); color: var(--text); }
        .metadata-section { border-bottom: 1px solid var(--line); }
        .metadata-section-header { display: flex; align-items: center; gap: 6px; padding: 12px 12px 7px; color: var(--muted); font-size: 9px; font-weight: 650; letter-spacing: .10em; text-transform: uppercase; }
        .metadata-section-header .icon { color: var(--accent); }
        .metadata-section-content { padding: 0 12px 12px; }
        .metadata-item { margin-bottom: 7px; }
        .metadata-label-row { display: flex; align-items: center; justify-content: space-between; gap: 6px; margin-bottom: 5px; }
        .metadata-label { color: var(--muted); font-size: 8.5px; font-weight: 620; letter-spacing: .08em; text-transform: uppercase; }
        .metadata-value, .file-info-item .value { color: var(--text-2); font-size: 10.5px; word-break: break-word; }
        .metadata-prompt, .metadata-kv, .lora-item, .file-info-item, .settings-grid .metadata-item {
            padding: 8px; border: 1px solid var(--line); border-radius: 6px; background: var(--panel-2); color: var(--text-2);
        }
        .metadata-prompt { max-height: 240px; overflow: auto; font-size: 10.5px; line-height: 1.55; white-space: pre-wrap; }
        .settings-grid, .file-info-grid, .metadata-extra-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 5px; }
        .settings-grid .full-width, .file-info-grid .full-width { grid-column: 1 / -1; }
        .metadata-copy-btn { height: 22px; min-height: 22px; padding: 0 6px; border: 1px solid var(--line); border-radius: 4px; background: var(--panel); color: var(--muted); font-size: 8px; text-transform: uppercase; }
        .metadata-copy-btn:hover { border-color: rgba(var(--accent-rgb),.45); color: #cbd6ff; }
        .lora-name { color: #c4d0ff; font-size: 10.5px; font-weight: 600; }
        .lora-strength { margin-top: 2px; color: var(--muted); font-size: 9px; }
        .modal-delete-btn { width: 100%; min-height: 38px; margin-top: auto; border: 0; border-radius: 0; background: rgba(235,112,121,.09); color: #ffabb1; font-size: 10.5px; }

        .workflow-search { position: sticky; top: 0; z-index: 2; padding-bottom: 7px; background: var(--panel); }

            <span class="modal-close" onclick="closeModal()">&times;</span>
        </div>
        <button class="modal-nav modal-nav-prev" id="modalNavPrev" onclick="navigatePrev()" aria-label="Previous image"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"></polyline></svg></button>
        <button class="modal-nav modal-nav-next" id="modalNavNext" onclick="navigateNext()" aria-label="Next image"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 18 15 12 9 6"></polyline></svg></button>
        <div class="modal-content">
            <div class="viewer-stage">
                <div class="modal-left" id="modalMediaContainer"></div>
                <div class="modal-filmstrip"><div class="filmstrip-track" id="modalFilmstrip"></div><div class="filmstrip-count" id="filmstripCount">0 / 0</div></div>
            </div>
            <div class="modal-right" id="metadataPanel"></div>
        </div>
    </div>

    <div class="modal" id="compareModal">
        <div class="viewer-toolbar"><button class="viewer-back" onclick="closeCompareModal()">← Library</button><div class="viewer-identity"><strong>Compare</strong><span>Drag the divider to inspect differences</span></div><span class="modal-close" onclick="closeCompareModal()">&times;</span></div>
        <div id="compareContainer"></div>
    </div>

    <script src="/gemini-image-browser/js"></script>
</body>
</html>
